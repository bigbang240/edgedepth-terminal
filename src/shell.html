<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeDepth Terminal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230B0E13'/><g fill='%234DDBAC' transform='translate(3 18) scale(.19)'><path d='M58 14H138L126 40H46Z'/><path d='M20 53H154L142 79H8Z'/><path d='M49 92H129L117 118H37Z'/><path d='M151 14H208C250 14 280 36 280 66C280 96 250 118 208 118H126L138 92H207C233 92 250 82 250 66C250 50 233 40 207 40H139Z'/></g></svg>">
    <meta name="theme-color" content="#0B0E13">
    <script src="coi-serviceworker.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1e;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #4DDBAC;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 11px;
            background: rgba(10,14,18,0.85);
            border: 1px solid rgba(150,168,184,0.13);
            padding: 7px 11px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Initializing...</div>

<script type='text/javascript'>
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
        (e.metaKey && e.altKey && e.keyCode === 73)) {
            e.stopPropagation();
            return true;
        }
    }, true);

    var Module = {
        locateFile: function(path) {
            return '/' + path;
        },
        preRun: [],
        postRun: [],
        print: function(text) {
            console.log(text);
        },
        printErr: function(text) {
            console.error(text);
        },
        canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) {
                alert('WebGL context lost. Please reload.');
                e.preventDefault();
            }, false);
            return canvas;
        })(),
        setStatus: function(text) {
            var statusDiv = document.getElementById('status');
            if (!statusDiv) return;
            // Hide once the app is actually running - the runtime emits
            // 'Running...' after onRuntimeInitialized, so without this the
            // badge lingers over the terminal forever.
            if (!text || /Running/.test(text)) {
                statusDiv.style.display = 'none';
                return;
            }
            statusDiv.textContent = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            Module.setStatus(left ? 'Preparing (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Ready');
        }
    };
    Module.setStatus('Downloading');
    document.getElementById('canvas').addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
</script>

<script type='text/javascript'>
    /* ── Self-host boot helpers + tooling bridge ──────────────────────── */
    /* Fire-and-forget boot ping for the Next.js wrapper's service starter. */
    try { fetch("/api/services/boot", {cache: "no-store"}).catch(function(){}); } catch (e) {}
    /* One-shot reload if the shell never reaches Ready (stale asset pair). */
    (function () {
        var started = Date.now();
        var iv = setInterval(function () {
            var s = document.getElementById("status");
            if (s && (s.style.display === "none" || s.textContent === "Ready")) {
                clearInterval(iv);
                try { sessionStorage.removeItem("edBootReload"); } catch (e) {}
                return;
            }
            if (Date.now() - started > 30000) {
                clearInterval(iv);
                try {
                    if (!sessionStorage.getItem("edBootReload")) {
                        sessionStorage.setItem("edBootReload", "1");
                        location.reload();
                    }
                } catch (e) {}
            }
        }, 1000);
    })();
    /* ── [SELF-HOST P1] tooling bridge ────────────────────────────────────
     * window.__ed_state → mirrored twice a second from the live chart
     * (symbol/venue/tf/bid/ask/ts; the app writes Module.edState).
     * __EDGEDEPTH_RT_ARCHIVE_MS__ raises the browser-local archive horizon
     * (30min shipped default, 12h max; the IndexedDB budget scales with it). */
    window.__EDGEDEPTH_RT_ARCHIVE_MS__ = window.__EDGEDEPTH_RT_ARCHIVE_MS__ || 2 * 60 * 60 * 1000;
    window.__ed_state = null;
    /* Frame capture WITHOUT touching the WASM: captureStream(0) grabs the
     * composited canvas frame on demand (works even though the WebGL context
     * has preserveDrawingBuffer=false), then a 2D canvas re-encodes it to PNG. */
    window.__ed_snapshot = function () {
        return new Promise(function (resolve) {
            try {
                var canvas = document.getElementById('canvas');
                if (!window.__edStream) {
                    window.__edStream = canvas.captureStream(0);
                    window.__edTrack = window.__edStream.getVideoTracks()[0];
                    window.__edVideo = document.createElement('video');
                    window.__edVideo.srcObject = window.__edStream;
                    window.__edVideo.muted = true;
                    window.__edVideo.play().catch(function () {});
                }
                window.__edTrack.requestFrame();
                setTimeout(function () {
                    try {
                        var v = window.__edVideo;
                        if (!v || !v.videoWidth) { resolve({ error: 'no-frame' }); return; }
                        var c = document.createElement('canvas');
                        c.width = v.videoWidth;
                        c.height = v.videoHeight;
                        c.getContext('2d').drawImage(v, 0, 0);
                        resolve({ png: c.toDataURL('image/png'), ts: Date.now() });
                    } catch (e2) { resolve({ error: String(e2) }); }
                }, 140);
            } catch (e) { resolve({ error: String(e) }); }
        });
    };
    setInterval(function () {
        try { if (window.Module && Module.edState) window.__ed_state = Module.edState; } catch (e) {}
    }, 500);
</script>

{{{ SCRIPT }}}

<script type='text/javascript'>
    Module.onRuntimeInitialized = function() {
        var canvas = Module.canvas;
        window.addEventListener('resize', function() {
            var width = window.innerWidth;
            var height = window.innerHeight;
            var dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
        });
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        var statusDiv = document.getElementById('status');
        if (statusDiv) {
            statusDiv.textContent = 'Ready';
            setTimeout(function() {
                statusDiv.style.display = 'none';
            }, 2000);
        }
    };
</script>
</body>
</html>
